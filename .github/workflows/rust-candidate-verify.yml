name: Rust candidate source validation

on:
  pull_request:
    paths:
      - 'rust-candidate/**'
      - '.github/workflows/rust-candidate-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-native:
    needs: upstream-renderer
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: rust-candidate
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install hosted tooling
        run: npm ci --no-audit --no-fund
      - name: Download verified original renderer bundle
        uses: actions/download-artifact@v4
        with:
          name: csdm-ported-renderer
          path: rust-candidate/ported/dist
      - name: Build native original renderer host
        run: npm run tauri -- build --config src-tauri/tauri.upstream.smoke.conf.json --features synthetic-import-smoke
      - name: Generate sanitized synthetic library
        run: python tests/make_smoke_fixture.py
      - name: Exercise original startup and capture native app
        run: node tests/original-native-smoke.cjs
        env:
          DEMOSTRIKE_SYNTHETIC_RAW_FACTS: ${{ github.workspace }}/rust-candidate/tests/fixtures/combat-raw.json
      - name: Fetch pinned public CS2 demo for real native UI import
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'public-cs2-fixture.dem'
          curl.exe --fail --location --retry 2 --max-filesize 65000000 --max-time 180 --output $fixture 'https://raw.githubusercontent.com/LaihoE/demoparser/45ca85aeac8fb0de9d385124d2c7fe0e7b8ff0c8/src/parser/test_demo.dem'
          if ($LASTEXITCODE -ne 0) { throw 'Public fixture download failed' }
          if ((Get-Item -LiteralPath $fixture).Length -ne 60601900) { throw 'Public fixture size changed' }
          if ((git hash-object -- $fixture) -ne 'e5cc97203262ab36bb756514b02d56eb6bd972a0') { throw 'Public fixture content changed' }
      - name: Import public demo in actual Tauri WebView2 window
        run: node tests/public-native-smoke.cjs
      - name: Upload original app-only capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demostrike-original-native-startup
          path: ${{ runner.temp }}/demostrike-original/*
          if-no-files-found: warn
          retention-days: 1
      - name: Upload real-demo app-only capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demostrike-public-native-ui
          path: ${{ runner.temp }}/demostrike-public-native/*
          if-no-files-found: warn
          retention-days: 1
  upstream-renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: rust-candidate/upstream/cs-demo-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned upstream package manager
        run: npm install --global pnpm@12.6.0 --ignore-scripts --no-audit --no-fund
      - name: Install original renderer dependencies without native postinstall
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Compile original CS Demo Manager renderer source
        run: |
          mkdir -p static
          ./node_modules/.bin/vp build --config vite.config.ts
      - name: Compile original routes with Tauri startup adapters
        run: ./node_modules/.bin/vp build --config ../../ported/vite.config.mjs
      - name: Verify ported transport is in the renderer bundle
        working-directory: rust-candidate
        run: node tests/check-ported-bundle.cjs
      - name: Test original settings update contract
        working-directory: rust-candidate
        run: node tests/settings-merge.test.mjs
      - name: Share renderer bundle with hosted native job
        uses: actions/upload-artifact@v4
        with:
          name: csdm-ported-renderer
          path: rust-candidate/ported/dist
          if-no-files-found: error
          retention-days: 1
  verify:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: rust-candidate
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pinned upstream source baseline
        run: python tests/check_upstream_snapshot.py
      - name: Install frontend dependencies on hosted runner
        run: npm ci --no-audit --no-fund
      - name: Typecheck and build frontend
        run: npm run build
      - name: Test adapted upstream score contract
        run: npm run test:contracts
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Keep CDP out of normal app configuration
        run: python tests/check_smoke_config.py
      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets -- --test-threads=1
      - name: Test DemoStrike native parser and import core
        run: cargo test --locked --manifest-path ../Cargo.toml --lib -- --test-threads=1
      - name: Compile native application
        run: npm run tauri -- build --config src-tauri/tauri.smoke.conf.json
      - name: Generate sanitized synthetic SQLite fixture
        run: python tests/make_smoke_fixture.py
      - name: Launch real Tauri WebView2 and exercise IPC
        run: npm run test:native-smoke
      - name: Record resolved dependency metadata
        if: always()
        run: python tests/dependency_manifest.py
      - name: Verify dependency locks did not drift
        if: always()
        run: git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
      - name: Upload app-only synthetic UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demostrike-tauri-synthetic-ui
          path: ${{ runner.temp }}/demostrike-smoke/synthetic-*.png
          if-no-files-found: warn
          retention-days: 1
      - name: Upload synthetic smoke proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demostrike-tauri-synthetic-proof
          path: ${{ runner.temp }}/demostrike-smoke/synthetic-smoke-proof.json
          if-no-files-found: warn
          retention-days: 1
      - name: Upload resolved dependency record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demostrike-candidate-dependencies
          path: |
            ${{ runner.temp }}/demostrike-smoke/dependencies-resolved.json
            rust-candidate/package-lock.json
            rust-candidate/src-tauri/Cargo.lock
          if-no-files-found: warn
          retention-days: 1

