name: Rust candidate source validation

on:
  pull_request:
    paths:
      - 'rust-candidate/**'
      - '.github/workflows/rust-candidate-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: rust-candidate
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies on hosted runner
        run: npm install --no-audit --no-fund
      - name: Typecheck and build frontend
        run: npm run build
      - name: Test adapted upstream score contract
        run: npm run test:contracts
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets -- --test-threads=1
      - name: Compile native application
        run: npm run tauri build
