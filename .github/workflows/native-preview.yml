name: Native preview executable

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/native-screenshot-2026-10-15]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      DEMOSTRIKE_REVIEW_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Select stable Rust
        shell: pwsh
        run: rustup default stable
      - name: Test Rust parser, database, reader and replay contracts
        shell: pwsh
        run: cargo test --locked --lib
      - name: Test actual Rust review UI and import identity
        shell: pwsh
        run: |
          cargo test --locked --features native-ui --lib native_review -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Native Rust review interaction tests failed' }
          cargo test --locked --features native-ui --lib ui::tests::completed_import_cannot_reinterpret_a_match_in_a_new_library_or_navigation -- --exact --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Import library identity regression failed' }
      - name: Test imported match navigation
        shell: pwsh
        run: cargo test --locked --features native-ui --lib ui::tests::native_import_worker_persists_demo_and_cancel_keeps_previous_analysis -- --exact --test-threads=1
      - name: Test saved FilmCraft project navigation
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'demostrike-native-smoke'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          $env:DEMOSTRIKE_NATIVE_SMOKE_PROJECT = Join-Path $folder 'synthetic.fcproj'
          cargo test --locked --features native-ui --lib ui::tests::synthetic_filmcraft_project_opens_through_demo_workspace -- --exact --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'FilmCraft navigation test failed' }
          if (-not (Test-Path -LiteralPath $env:DEMOSTRIKE_NATIVE_SMOKE_PROJECT)) { throw 'Synthetic FilmCraft project was not saved' }
      - name: Test isolated audio generation invariant
        shell: pwsh
        run: cargo test --locked --features native-ui --lib ui::filmcraft_audio::tests::stale_ready_generation_cannot_activate_or_become_the_clock -- --exact --test-threads=1 --nocapture
      - name: Test synthetic CLI fixtures
        shell: pwsh
        run: cargo test --locked --features native-ui --test cli
      - name: Test native capture argument handling
        shell: pwsh
        run: cargo test --locked --features native-ui --bin demostrike
      - name: Build native editor
        shell: pwsh
        run: cargo build --locked --features native-ui --bin demostrike
      - name: Import hash-pinned real demo through Rust and prove all recorded rounds
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'demostrike-rust-review'
          New-Item -ItemType Directory -Path $folder -ErrorAction Stop | Out-Null
          $demo = Join-Path $folder 'mirage.dem'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/LaihoE/demoparser/45ca85aeac8fb0de9d385124d2c7fe0e7b8ff0c8/src/parser/test_demo.dem' -OutFile $demo
          if ((Get-Item -LiteralPath $demo).Length -ne 60601900 -or (Get-FileHash -LiteralPath $demo -Algorithm SHA256).Hash.ToLowerInvariant() -ne '84a1a4191302bdd2a3bbb5a727842093744b1fb1a228aeec630369e44b622cb2') { throw 'Public real-demo fixture pin mismatch' }
          $radar = Join-Path $folder 'de_mirage.png'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/akiver/cs-demo-manager/7270bc95c8cab87b7f9ddd490fea13c6eda3ace7/static/images/maps/cs2/radars/de_mirage.png' -OutFile $radar
          if ((Get-Item -LiteralPath $radar).Length -ne 144543 -or (Get-FileHash -LiteralPath $radar -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'af139a92cf929214f7c0ac35e2d8c82bad385d83e71eeaf7b955dac96467a136') { throw 'Pinned upstream radar mismatch' }
          cargo test --locked --bin demostrike-rust-review-proof
          if ($LASTEXITCODE -ne 0) { throw 'Rust proof CLI/no-clobber tests failed' }
          $database = Join-Path $folder 'mirage.sqlite'
          $proof = Join-Path $folder 'real-demo-rust-proof.json'
          cargo run --locked --bin demostrike-rust-review-proof -- --demo $demo --database $database --proof $proof
          if ($LASTEXITCODE -ne 0) { throw 'Real-demo Rust reader/replay proof failed' }
      - name: Capture actual native Rust match viewer with source-bound paint receipt
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'demostrike-rust-review'
          $env:DEMOSTRIKE_RUST_REVIEW_DATABASE = Join-Path $folder 'mirage.sqlite'
          $env:DEMOSTRIKE_RUST_REVIEW_RADAR = Join-Path $folder 'de_mirage.png'
          $env:DEMOSTRIKE_RUST_REVIEW_HEADLESS_PROOF = Join-Path $folder 'real-demo-rust-proof.json'
          $env:DEMOSTRIKE_RUST_REVIEW_EVIDENCE = Join-Path $folder 'native-captures'
          cargo test --locked --features native-ui --test native_rust_review -- --ignored --test-threads=1 --nocapture 2>&1 | Tee-Object -FilePath (Join-Path $folder 'native-rust-review-output.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Actual native Rust renderer acceptance failed' }
          $exeHash = (Get-FileHash -LiteralPath target/debug/demostrike.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          @{ commit = $env:GITHUB_SHA; executable_sha256 = $exeHash; real_demo_sha256 = '84a1a4191302bdd2a3bbb5a727842093744b1fb1a228aeec630369e44b622cb2'; scope = 'Native Rust review milestone only, not complete CSDM parity or media capture' } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $folder 'hosted-source-binding.json') -Encoding utf8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demostrike-native-rust-review-${{ github.sha }}
          path: |
            ${{ runner.temp }}/demostrike-rust-review/*.json
            ${{ runner.temp }}/demostrike-rust-review/*output.txt
            ${{ runner.temp }}/demostrike-rust-review/native-captures/
          retention-days: 1
          if-no-files-found: warn
      - name: Capture empty native workspace
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'demostrike-empty-data'
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          $output = Join-Path $env:RUNNER_TEMP 'demostrike-empty-workspace.png'
          & target/debug/demostrike.exe --capture $output
          if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $output)) { throw 'Hosted native capture unavailable' }
          Add-Type -AssemblyName System.Drawing
          $bitmap = [System.Drawing.Bitmap]::FromFile($output)
          try {
            if ($bitmap.Width -lt 1000 -or $bitmap.Height -lt 700) { throw 'Native capture dimensions too small' }
            $colors = [System.Collections.Generic.HashSet[int]]::new()
            for ($x = 40; $x -lt $bitmap.Width; $x += 47) {
              for ($y = 40; $y -lt $bitmap.Height; $y += 47) {
                [void]$colors.Add($bitmap.GetPixel($x, $y).ToArgb())
              }
            }
            if ($colors.Count -lt 8) { throw "Native capture lacks rendered detail: $($colors.Count) colors" }
            "Native workspace $($bitmap.Width)x$($bitmap.Height), $($colors.Count) sampled colors, commit $env:GITHUB_SHA"
          } finally { $bitmap.Dispose() }
      - uses: actions/upload-artifact@v4
        with:
          name: demostrike-workspace-${{ github.sha }}
          path: ${{ runner.temp }}/demostrike-empty-workspace.png
          retention-days: 1
          if-no-files-found: warn
      - name: Capture synthetic FilmCraft project in native renderer
        shell: pwsh
        run: |
          $project = Join-Path (Join-Path $env:RUNNER_TEMP 'demostrike-native-smoke') 'synthetic.fcproj'
          $folder = Join-Path $env:RUNNER_TEMP 'demostrike-filmcraft-evidence'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          $env:LOCALAPPDATA = Join-Path $folder 'app-data'
          New-Item -ItemType Directory -Path $env:LOCALAPPDATA -Force | Out-Null
          $env:DEMOSTRIKE_EDITOR_CAPTURE_PROOF = '1'
          $output = Join-Path $folder 'filmcraft-native.png'
          $log = Join-Path $folder 'native-output.txt'
          & target/debug/demostrike.exe --project $project --capture $output 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $output)) { throw 'Native FilmCraft screenshot unavailable' }
          if (-not ((Get-Content -LiteralPath $log -Raw) -match 'EDITOR_FRAME show_embedded_editor_done')) { throw 'Actual FilmCraft editor frame was not observed' }
          $bytes = [IO.File]::ReadAllBytes($output)
          if ($bytes.Length -lt 10000 -or $bytes.Length -gt 5MB) { throw 'Native FilmCraft PNG has unexpected size' }
          if ([Convert]::ToHexString($bytes[0..7]) -ne '89504E470D0A1A0A') { throw 'Native FilmCraft output is not PNG' }
          Add-Type -AssemblyName System.Drawing
          $bitmap = [System.Drawing.Bitmap]::FromFile($output)
          try {
            if ($bitmap.Width -lt 1000 -or $bitmap.Height -lt 700) { throw 'Native FilmCraft image dimensions too small' }
            $colors = [System.Collections.Generic.HashSet[int]]::new()
            for ($x = 40; $x -lt $bitmap.Width; $x += 47) {
              for ($y = 40; $y -lt $bitmap.Height; $y += 47) {
                [void]$colors.Add($bitmap.GetPixel($x, $y).ToArgb())
              }
            }
            if ($colors.Count -lt 8) { throw "Native FilmCraft image lacks rendered detail: $($colors.Count) colors" }
            "Native FilmCraft $($bitmap.Width)x$($bitmap.Height), $($colors.Count) sampled colors, commit $env:GITHUB_SHA"
          } finally { $bitmap.Dispose() }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demostrike-filmcraft-${{ github.sha }}
          path: ${{ runner.temp }}/demostrike-filmcraft-evidence/
          retention-days: 1
          if-no-files-found: warn
      - name: Exercise native saved matches, project menu, and return
        shell: pwsh
        run: |
          $project = Join-Path (Join-Path $env:RUNNER_TEMP 'demostrike-native-smoke') 'synthetic.fcproj'
          $evidence = Join-Path $env:RUNNER_TEMP 'demostrike-legacy-native-evidence'
          ./tests/legacy_navigation_native.ps1 -Project $project -EvidenceDir $evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demostrike-legacy-navigation-${{ github.sha }}
          path: ${{ runner.temp }}/demostrike-legacy-native-evidence/
          retention-days: 1
          if-no-files-found: warn
      - name: Bound and hash executable
        shell: pwsh
        run: |
          $exe = Get-Item target/debug/demostrike.exe
          if ($exe.Length -gt 180MB) { throw "Debug executable exceeds 180 MiB cap: $($exe.Length)" }
          New-Item -ItemType Directory -Force artifact | Out-Null
          $sha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          "$sha  demostrike.exe" | Set-Content artifact/SHA256.txt -Encoding ascii
          Write-Output "Executable bytes: $($exe.Length); SHA-256: $sha"
      - uses: actions/upload-artifact@v4
        with:
          name: demostrike-native-preview
          path: |
            target/debug/demostrike.exe
            artifact/SHA256.txt
          if-no-files-found: error
          retention-days: 1
