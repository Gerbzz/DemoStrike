name: Native preview executable

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/native-screenshot-2026-10-15]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Select stable Rust
        shell: pwsh
        run: rustup default stable
      - name: Test native capture argument handling
        shell: pwsh
        run: cargo test --locked --features native-ui --bin demostrike
      - name: Build native editor
        shell: pwsh
        run: cargo build --locked --features native-ui --bin demostrike
      - name: Bound and hash executable
        shell: pwsh
        run: |
          $exe = Get-Item target/debug/demostrike.exe
          if ($exe.Length -gt 180MB) { throw "Debug executable exceeds 180 MiB cap: $($exe.Length)" }
          New-Item -ItemType Directory -Force artifact | Out-Null
          $sha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          "$sha  demostrike.exe" | Set-Content artifact/SHA256.txt -Encoding ascii
          Write-Output "Executable bytes: $($exe.Length); SHA-256: $sha"
      - uses: actions/upload-artifact@v4
        with:
          name: demostrike-native-preview
          path: |
            target/debug/demostrike.exe
            artifact/SHA256.txt
          if-no-files-found: error
          retention-days: 1
