name: Approved branding contract
on: [push, pull_request]
permissions:
  contents: read
jobs:
  approved-branding:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python tools/export_approved_branding.py --check
