[package]
name = "filmcraft-ui-egui"
description = "The FilmCraft egui frontend (swappable): panels, docking, timeline, monitors, control channel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
filmcraft-time = { git = "https://github.com/Gerbzz/Clipstrike", rev = "a539163b9d86546ba61130c56a0395e05d16d39d" }
filmcraft-geom = { git = "https://github.com/Gerbzz/Clipstrike", rev = "a539163b9d86546ba61130c56a0395e05d16d39d" }
filmcraft-color = { git = "https://github.com/Gerbzz/Clipstrike", rev = "a539163b9d86546ba61130c56a0395e05d16d39d" }
filmcraft-frame = { git = "https://github.com/Gerbzz/Clipstrike", rev = "a539163b9d86546ba61130c56a0395e05d16d39d" }
filmcraft-media = { git = "https://github.com/Gerbzz/Clipstrike", rev = "a539163b9d86546ba61130c56a0395e05d16d39d" }
filmcraft-project = { git = "https://github.com/Gerbzz/Clipstrike", rev = "a539163b9d86546ba61130c56a0395e05d16d39d" }
filmcraft-tts = { git = "https://github.com/Gerbzz/Clipstrike", rev = "a539163b9d86546ba61130c56a0395e05d16d39d" }
filmcraft-edit = { git = "https://github.com/Gerbzz/Clipstrike", rev = "a539163b9d86546ba61130c56a0395e05d16d39d" }
filmcraft-render = { git = "https://github.com/Gerbzz/Clipstrike", rev = "a539163b9d86546ba61130c56a0395e05d16d39d" }
filmcraft-text = { git = "https://github.com/Gerbzz/Clipstrike", rev = "a539163b9d86546ba61130c56a0395e05d16d39d" }
filmcraft-audio-dsp = { git = "https://github.com/Gerbzz/Clipstrike", rev = "a539163b9d86546ba61130c56a0395e05d16d39d" }
filmcraft-engine = { git = "https://github.com/Gerbzz/Clipstrike", rev = "a539163b9d86546ba61130c56a0395e05d16d39d" }
filmcraft-export = { git = "https://github.com/Gerbzz/Clipstrike", rev = "a539163b9d86546ba61130c56a0395e05d16d39d" }
filmcraft-gpu = { git = "https://github.com/Gerbzz/Clipstrike", rev = "a539163b9d86546ba61130c56a0395e05d16d39d" }
filmcraft-scopes = { git = "https://github.com/Gerbzz/Clipstrike", rev = "a539163b9d86546ba61130c56a0395e05d16d39d" }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
rayon = { workspace = true }
web-time = "1"
# Image handling for imported media and thumbnails.
image = { version = "0.25", default-features = false, features = ["png"] }

# Thread/process CPU clocks for frame-job profiling (safe wrappers; see frames.rs).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "time"] }
# the same clocks on Windows (GetThreadTimes / GetProcessTimes behind a safe API; MIT OR Apache-2.0)
[target.'cfg(windows)'.dependencies]
cpu-time = "1"

[dev-dependencies]
pollster = "0.4"
filmcraft-codecs = { git = "https://github.com/Gerbzz/Clipstrike", rev = "a539163b9d86546ba61130c56a0395e05d16d39d" }
# the bench registers OS hardware decoders as the desktop app does (dev-dependency only: ui-egui
# itself stays OS-independent and web-portable)
filmcraft-platform = { git = "https://github.com/Gerbzz/Clipstrike", rev = "a539163b9d86546ba61130c56a0395e05d16d39d" }
filmcraft-interchange = { git = "https://github.com/Gerbzz/Clipstrike", rev = "a539163b9d86546ba61130c56a0395e05d16d39d" }
egui_kittest = { workspace = true, features = ["eframe", "wgpu"] }

# build.rs bakes contributors/contributors.json into the binary (About ▸ Contributors).
[build-dependencies]
serde_json = { workspace = true }
toml = "1"
